[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipflow-visual"
version = "0.7.0"
description = "Visual-only, evidence-gated video splitting with a guarded Feishu Bitable worker"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "rapidocr-onnxruntime>=1.3",
  "requests>=2.31",
]

[project.scripts]
clipflow-visual = "clipflow.cli:main"
omni-phase1 = "omni_phase1.cli:main"

[tool.setuptools]
packages = ["clipflow", "omni_phase1"]
